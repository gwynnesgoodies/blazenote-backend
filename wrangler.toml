name = "blazenote-backend"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = [ "nodejs_compat" ]

[[d1_databases]]
binding = "DB"
database_name = "blazenote"
database_id = "97e1d8eb-8fe0-4a77-bccb-71829c6c8904"
migrations_dir = "./migrations"

# [ai]
# binding = "AI"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "blazenote"
preview_bucket_name = "dev-blazenote"

[observability.logs]
enabled = true